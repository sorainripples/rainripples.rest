<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <style>
    /* Default: Light Mode (Dark tile, white icon elements) */
    .bg { fill: #1A1D20; }
    .fg { fill: #FFFFFF; }

    /* Dark Mode Override (Light tile, dark icon elements) */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #F8F9FA; }
      .fg { fill: #1A1D20; }
    }
  </style>
  
  <!-- Rounded square background maximizing the 32x32 canvas -->
  <rect width="32" height="32" rx="7" class="bg" />
  
  <!-- The perfectly proportioned, high-visibility raindrop -->
  <path d="M16 4C16 4 11 10.5 11 14C11 16.76 13.24 19 16 19C18.76 19 21 16.76 21 14C21 10.5 16 4" class="fg" />
  
  <!-- The squashed circle (ellipse) representing the lake surface perspective -->
  <ellipse cx="16" cy="24.5" rx="9" ry="3.5" class="fg" />
</svg>
